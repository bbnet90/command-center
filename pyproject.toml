[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "command-center"
version = "0.2.0"
description = "An offline-first terminal dashboard for independent local panels"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["terminal", "dashboard", "plugins", "offline"]
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
]
requires-python = ">=3.11"
dependencies = ["rich", "textual>=8.2.8"]

[project.urls]
Repository = "https://github.com/bbnet90/command-center"
Issues = "https://github.com/bbnet90/command-center/issues"

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
command-center = "command_center.cli:entrypoint"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.package-data]
command_center = ["data/catalog.toml", "data/templates/*.tmpl"]
