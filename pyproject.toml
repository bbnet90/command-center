[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "command-center"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["rich"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
command-center = "command_center.cli:entrypoint"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.setuptools.package-data]
command_center = ["data/catalog.toml", "data/templates/*.tmpl"]
