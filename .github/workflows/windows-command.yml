name: Windows command panels
on: [push, pull_request]
jobs:
  windows-command:
    runs-on: windows-latest
    timeout-minutes: 12
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install . pywinpty
      - name: Verify shim lookup, panel and open
        run: python tests/windows_command_smoke.py shim
